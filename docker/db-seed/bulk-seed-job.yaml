# Run generate_nsr_bulk_sample.py inside the cluster.
#
# A bulk load over `kubectl port-forward` does not survive: the tunnel drops
# part-way through ("lost connection to pod") and leaves the register tables
# half-written. Running in-cluster removes the tunnel entirely, talks to
# commons-postgresql over the service network, and is the same shape a seed
# Job would take at install time.
#
# The geography comes from Master Data's API (never its database), read with the
# registry platform's stdlib client, so ship that beside the script:
#
#   kubectl -n <ns> create configmap nsr-bulk-seed \
#       --from-file=generate_nsr_bulk_sample.py --from-file=distributions.json \
#       --from-file=../../../registry-platform/docker/db-seed/mds_client.py
#   kubectl -n <ns> apply -f bulk-seed-job.yaml
#   kubectl -n <ns> logs -f job/nsr-bulk-seed
#
# To undo everything the Job wrote, set ARGS to "--purge" and re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: nsr-bulk-seed
spec:
  backoffLimit: 0 # a partial load must be purged, not blindly retried
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir --quiet psycopg2-binary
              # --distributions is passed explicitly: the ConfigMap mounts the
              # script and the data side by side in /seed, whereas the script's
              # default expects the openg2p-data repo layout.
              python /seed/generate_nsr_bulk_sample.py \
                --distributions /seed/distributions.json $ARGS
          env:
            - name: ARGS
              value: "--individuals 1000000"
            - name: PGHOST
              value: commons-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: commons-postgresql
                  key: postgres-password
            - name: NSR_DB
              value: nsr
            # Master Data, through its API as the registry's own Keycloak client
            # (the staff-portal client keycloak-init creates for release `nsr`).
            # Replace <baseDomain> with the environment's domain.
            - name: MDS_API_URL
              value: http://commons-services-master-data-api
            - name: MDS_TOKEN_URL
              value: https://keycloak.<baseDomain>/realms/staff/protocol/openid-connect/token
            - name: MDS_CLIENT_ID
              value: nsr-staff-portal
            - name: MDS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nsr-staff-portal
                  key: client_secret
          volumeMounts:
            - name: seed
              mountPath: /seed
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 1Gi
      volumes:
        - name: seed
          configMap:
            name: nsr-bulk-seed
